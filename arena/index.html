<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PvP Arena — Movement Prototype</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; height: 100%;
      background: #0b0f16; color: #e7eef9;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    .wrap {
      min-height: 100%;
      display: flex; flex-direction: column;
      align-items: center; gap: 14px; padding: 18px;
      box-sizing: border-box;
    }
    #hud {
      display: flex; align-items: center; gap: 22px;
      font-size: 22px; font-weight: 700; letter-spacing: 1px;
    }
    #hud .vs { opacity: .55; font-size: 15px; padding: 2px 10px;
      border: 1px solid rgba(255,255,255,.2); border-radius: 999px; }
    #hud .p1 { color: #7fffa8; }
    #hud .p2 { color: #ff9f7f; }
    .stage { position: relative; }
    canvas {
      display: block; border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
      image-rendering: pixelated;
    }
    #debug {
      position: absolute; top: 10px; left: 10px;
      margin: 0; padding: 10px 12px;
      background: rgba(8,12,20,.72); border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px; font-size: 12.5px; line-height: 1.45;
      white-space: pre; pointer-events: none; color: #b9c7da;
    }
    .help { opacity: .6; font-size: 13px; }
    .help b { color: #e7eef9; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="hud"></div>
    <div class="stage">
      <canvas id="game"></canvas>
      <pre id="debug"></pre>
    </div>
    <div class="help">
      Move <b>A</b>/<b>D</b> or <b>←</b>/<b>→</b> &nbsp;·&nbsp; Jump <b>W</b> / <b>↑</b> / <b>Space</b>
      &nbsp;·&nbsp; hold jump for height, tap for a hop
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
