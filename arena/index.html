<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PvP Arena — Diggerz prototype</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; height: 100%;
      background: #0b0f16; color: #e7eef9;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; box-sizing: border-box; }
    #hud { display: flex; align-items: center; gap: 22px; font-size: 22px; font-weight: 700; letter-spacing: 1px; }
    #hud .vs { opacity: .55; font-size: 15px; padding: 2px 10px; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; }
    #hud .p1 { color: #7fffa8; }
    #hud .p2 { color: #b9a3ff; }
    .stage { position: relative; }
    canvas { display: block; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.5); cursor: crosshair; }
    #debug {
      position: absolute; top: 10px; left: 10px; margin: 0; padding: 10px 12px;
      background: rgba(8,12,20,.72); border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px; font-size: 12.5px; line-height: 1.45; white-space: pre;
      pointer-events: none; color: #b9c7da;
    }
    #winbanner {
      position: absolute; inset: 0; display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; border-radius: 10px;
      background: rgba(8,12,20,.78);
    }
    #winbanner .title { font-size: 40px; font-weight: 800; color: #7fffa8; }
    button { font: inherit; font-size: 14px; cursor: pointer; background: #2a3346; color: #e7eef9; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; padding: 7px 14px; }
    button:hover { background: #354060; }
    .bar { display: flex; align-items: center; gap: 16px; opacity: .85; font-size: 13px; }
    .zoom { display: inline-flex; align-items: center; gap: 6px; }
    .zoom button { padding: 3px 9px; }
    #zoomLabel { min-width: 46px; text-align: center; }
    .help { opacity: .6; font-size: 13px; text-align: center; }
    .help b { color: #e7eef9; }
    label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    /* Dev-only playtest tuning panel */
    #tuningPanel {
      display: none; position: fixed; top: 12px; right: 12px; z-index: 40;
      width: 320px; max-height: calc(100vh - 24px); overflow-y: auto;
      background: rgba(10,14,22,.94); border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.55); font-size: 12px;
    }
    .tuning-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.08); position: sticky; top: 0; background: rgba(10,14,22,.98); }
    .tuning-head b { font-size: 13px; }
    .tuning-note { opacity: .5; font-size: 10.5px; }
    .tuning-x { margin-left: auto; padding: 1px 9px; }
    .tuning-body { padding: 6px 12px 2px; }
    .tuning-group { margin: 12px 0 4px; font-size: 11px; letter-spacing: .5px; text-transform: uppercase; color: #ffe27f; opacity: .85; }
    .tuning-row { display: grid; grid-template-columns: 104px 1fr 56px 34px; align-items: center; gap: 7px; padding: 3px 0; cursor: default; }
    .tuning-label { opacity: .85; }
    .tuning-row input[type=range] { width: 100%; }
    .tuning-num { width: 52px; font: inherit; font-size: 11px; background: #1a2233; color: #e7eef9; border: 1px solid rgba(255,255,255,.16); border-radius: 5px; padding: 2px 4px; }
    .tuning-unit { opacity: .45; font-size: 10px; }
    .tuning-actions { display: flex; gap: 8px; padding: 10px 12px; }
    .tuning-actions button { flex: 1; font-size: 12px; }
    .tuning-export { padding: 0 12px 12px; }
    .tuning-export textarea { width: 100%; box-sizing: border-box; background: #0c1018; color: #b9c7da; border: 1px solid rgba(255,255,255,.14); border-radius: 6px; font: inherit; font-size: 11px; resize: vertical; }
    #loading {
      position: fixed; inset: 0; z-index: 50;
      background: #000 center / contain no-repeat url("assets/loading.jpg");
      transition: opacity .35s ease;
    }
  </style>
</head>
<body>
  <div id="loading"></div>
  <div class="wrap">
    <div id="hud"></div>
    <div class="stage">
      <canvas id="game"></canvas>
      <pre id="debug"></pre>
      <div id="winbanner">
        <div class="title" data-win-text>P1 wins</div>
        <button id="rematchBtn">Rematch</button>
      </div>
    </div>
    <div class="bar">
      <label><input type="checkbox" id="debugChk" checked /> show aim + debug</label>
      <label><input type="checkbox" id="rigChk" /> rig anchors</label>
      <button id="resetBtn">Reset position</button>
      <span class="zoom">
        zoom <button id="zoomOutBtn">−</button>
        <span id="zoomLabel">1.00×</span>
        <button id="zoomInBtn">+</button>
        <button id="zoomResetBtn">reset</button>
      </span>
      <button id="tuneBtn" title="Dev-only playtest tuning panel" aria-expanded="false">⚙ Tuning</button>
    </div>
    <div class="help">
      Move <b>A</b>/<b>D</b> or <b>←</b>/<b>→</b> · Jump <b>W</b>/<b>↑</b>/<b>Space</b> · Descend <b>S</b>/<b>↓</b><br />
      Aim <b>mouse</b> · <b>Left-click</b> use weapon · Select weapon <b>1</b>/<b>2</b>/<b>3</b> · <b>Mouse wheel</b> zoom camera (<b>0</b> reset)
    </div>
  </div>
  <div id="tuningPanel"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
