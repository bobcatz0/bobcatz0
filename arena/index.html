<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PvP Arena — Movement Prototype</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; height: 100%;
      background: #0b0f16; color: #e7eef9;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    .wrap {
      min-height: 100%;
      display: flex; flex-direction: column;
      align-items: center; gap: 14px; padding: 18px;
      box-sizing: border-box;
    }
    #hud {
      display: flex; align-items: center; gap: 22px;
      font-size: 22px; font-weight: 700; letter-spacing: 1px;
    }
    #hud .vs { opacity: .55; font-size: 15px; padding: 2px 10px;
      border: 1px solid rgba(255,255,255,.2); border-radius: 999px; }
    #hud .p1 { color: #7fffa8; }
    #hud .p2 { color: #ff9f7f; }
    .stage { position: relative; }
    canvas {
      display: block; border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
      image-rendering: pixelated;
    }
    #debug {
      position: absolute; top: 10px; left: 10px;
      margin: 0; padding: 10px 12px;
      background: rgba(8,12,20,.72); border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px; font-size: 12.5px; line-height: 1.45;
      white-space: pre; pointer-events: none; color: #b9c7da;
    }
    #winbanner {
      position: absolute; inset: 0; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; border-radius: 10px;
      background: rgba(8,12,20,.78); backdrop-filter: blur(2px);
    }
    #winbanner .title { font-size: 40px; font-weight: 800; letter-spacing: 1px; color: #7fffa8; }
    #winbanner button, #resetBtn {
      font: inherit; font-size: 15px; cursor: pointer;
      background: #2a3346; color: #e7eef9;
      border: 1px solid rgba(255,255,255,.18); border-radius: 8px;
      padding: 8px 16px;
    }
    #winbanner button:hover, #resetBtn:hover { background: #354060; }
    .help { opacity: .6; font-size: 13px; text-align: center; }
    .help b { color: #e7eef9; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="hud"></div>
    <div class="stage">
      <canvas id="game"></canvas>
      <pre id="debug"></pre>
      <div id="winbanner">
        <div class="title" data-win-text>P1 Wins FT20</div>
        <button id="rematchBtn">Reset match (R)</button>
      </div>
    </div>
    <div class="help">
      Move <b>A</b>/<b>D</b> or <b>←</b>/<b>→</b> &nbsp;·&nbsp; Jump <b>W</b> / <b>↑</b> / <b>Space</b><br />
      Melee <b>J</b> / left-click &nbsp;·&nbsp; Shoot <b>K</b> / right-click
      &nbsp;·&nbsp; Debug boxes <b>H</b> &nbsp;·&nbsp; Reset <b>R</b>
    </div>
    <button id="resetBtn" style="margin-top:2px;">Reset match (R)</button>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
